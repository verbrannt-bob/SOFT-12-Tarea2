<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi LibroLista</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="./css/estilos.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-secondary">
        <div class="container-fluid">
            <div class="navbar-brand d-flex logo">
                <i class="fa-solid fa-book-open-reader fa-2xl"></i>
                <h1>Mi LibroLista</h1>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="menu">
                <ul class="navbar-nav">
                    <li class="navbar-item">
                        <a class="nav-link" href="#busqueda">Buscar Libro</a>
                    </li>
                    <li class="navbar-item">
                        <a class="nav-link" href="#lista">Mi lista</a>
                    </li>
                    <li class="navbar-item">
                        <a class="nav-link" href="#proponer">Proponer un Libro al Club</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main>
        <section id="busqueda" class="card">
            <h2>Buscar un libro:</h2>
            <div class="card-body">
                <form novalidate id="formularioBusqueda">
                    <input type="text" class="form-control" id="inputBusqueda" placeholder="Buscar Libros..."
                        aria-label="Buscar Libros">
                    <button type="submit" class="btn btn-primary">Buscar</button>
                </form>
            </div>
            <div id="estado"></div>
            <div id="resultados" class="row row-cols-2 row-cols-sm-4 row-cols-lg-6 g-3"></div>

            <div id="modales"></div>

        </section>
        <section class="table-responsive">
            <table class="table">
                <thead>
                    <th scope="col">Libro</th>
                    <th scope="col">Autor</th>
                    <th scope="col">Estado</th>
                    <th scope="col"></th>
                    <th scope="col"></th>
                </thead>
                <tbody id="lista"></tbody>
            </table>
        </section>
        <section class="card shadow-sm">
            <div class="card-body">
                <h2 class="h5 card-title mb-3">Proponer un libro al club de lectura</h2>
                <form id="form-propuesta" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="titulo" class="form-label">Título</label>
                            <input id="titulo" name="titulo" class="form-control" required minlength="2" placeholder=""
                                required />
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-6">
                            <div id="contenedor-input-autores" class="d-flex flex-column">
                                <label for="autor" class="form-label">Escrito por</label>
                                <div class="input-group d-flex mb-3">
                                    <input type="text" id="autor" name="autores[]" class="form-control"
                                        placeholder="Nombre de autor" minlength="2" required>
                                    <button type="button" id="agregarAutor" class="btn btn-outline-success"
                                        aria-label="Agregar otro autor"><i class="fa-solid fa-plus"></i></button>
                                    <div class="invalid-feedback"></div>
                                </div>

                            </div>

                        </div>
                        <div class="col-md-6">
                            <label for="annio" class="form-label">Año de publicación</label>
                            <input class="form-control" type="number" id="annio" name="annio" min="1400" max="2026"
                                placeholder="Ej: 2026" required />
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="paginas" class="form-label">Cantidad de páginas</label>
                            <input class="form-control" type="number" id="paginas" name="paginas" min="1"
                                placeholder="Ej: 300" required />
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="correo" class="form-label">Correo de quien propone</label>
                            <input id="correo" name="correo" type="email" class="form-control"
                                placeholder="Ej: nombre@dominio.com" required />
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="fechaSesion" class="form-label">Fecha de la sesión</label>
                            <div class="d-flex flex-row">
                                <span class="input-group-text">
                                    <i class="fa-solid fa-calendar-days" aria-hidden="true"></i>
                                </span>
                                <input aria-required="true" type="date" id="fechaSesion" name="fechaSesion"
                                    class="form-control" required>
                            </div>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="col-12">
                            <label for="motivo" class="form-label">Motivo</label>
                            <textarea id="motivo" name="motivo" class="form-control" rows="2" required></textarea>
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>
                    <button id="boton-propuesta" type="submit" class="btn btn-primary mt-3">Enviar propuesta</button>
                </form>
            </div>

            <div class="modal fade" id="modalNotificacion" tabindex="-1" aria-labelledby="modalNotificacionLabel">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header" id="modalHeader">
                            <h5 class="modal-title" id="modalNotificacionLabel">Notificación</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"
                                aria-label="Cerrar"></button>
                        </div>
                        <div class="modal-body" id="modalNotificacionMensaje">
                            <!-- El contenido se inserta dinámicamente -->
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer></footer>

    <script src="https://kit.fontawesome.com/ec05546885.js" crossorigin="anonymous"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script type="module" src="./js/formulario-busqueda.js"></script>
    <script type="module" src="./js/formulario-propuesta.js"></script>
    <script type="module" src="./js/lista.js"></script>
</body>

</html>
